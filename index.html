<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>과자마을 두뇌 대모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a20;--cream:#fff4dc;--brown:#8a5a2b;--pink:#ff8fb1;--mint:#7fd6a4;--sky:#8fd3ff;--yellow:#ffd35a;--red:#e8505b;--g1:#a6e59a;--g2:#98dc8c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:var(--ink);background-color:var(--g1);background-image:conic-gradient(var(--g2) 25%,transparent 0 50%,var(--g2) 0 75%,transparent 0);background-size:48px 48px;user-select:none;-webkit-user-select:none;overflow-x:hidden}
img.pix,.pix{image-rendering:pixelated}
img{image-rendering:pixelated}
button{font-family:inherit;color:inherit;cursor:pointer}
.screen{display:none;min-height:100vh;padding:14px 14px 40px;max-width:1040px;margin:0 auto}
.screen.on{display:block}
.panel{background:var(--cream);border:4px solid var(--ink);border-radius:10px;box-shadow:0 6px 0 var(--ink);padding:14px}
.pbtn{background:var(--yellow);border:4px solid var(--ink);border-radius:10px;padding:8px 16px;font-size:clamp(16px,2.6vw,21px);box-shadow:0 5px 0 var(--ink);transition:transform .05s}
.pbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.pbtn.pink{background:var(--pink)}.pbtn.mint{background:var(--mint)}.pbtn.sky{background:var(--sky)}.pbtn.white{background:#fff}
.pbtn.sm{padding:4px 10px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.pbtn:disabled{opacity:.45;pointer-events:none}
.sndbar{position:fixed;top:8px;right:8px;display:flex;gap:6px;z-index:50}
.sndbar button{width:44px;height:44px;font-size:20px;padding:0}
.sndbar button.off{opacity:.45}
/* title */
.logo{text-align:center;margin:30px 0 8px;font-size:clamp(34px,8vw,68px);line-height:1.1;color:#fff;text-shadow:4px 4px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),0 5px 0 var(--ink)}
.logo small{display:block;font-size:.38em;color:var(--yellow);margin-bottom:6px}
.strip{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0}
.strip div{width:clamp(50px,10vw,84px);aspect-ratio:1;border:4px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 4px 0 var(--ink);animation:bob 1.2s steps(2) infinite}
.strip div:nth-child(even){animation-delay:.3s}
.strip img{width:100%;height:100%;object-fit:cover}
@keyframes bob{50%{transform:translateY(-6px)}}
.kidpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 16px}
.kidcard{background:#fff;border:4px solid var(--ink);border-radius:10px;padding:8px 4px;text-align:center;box-shadow:0 4px 0 var(--ink);font-size:clamp(14px,2.4vw,19px)}
.kidcard img{width:clamp(48px,11vw,80px);display:block;margin:0 auto 4px}
.kidcard small{display:block;font-size:.72em;opacity:.7}
.kidcard.sel{background:var(--yellow);transform:translateY(-4px);box-shadow:0 8px 0 var(--ink)}
.kidcard.sel img{animation:bob .5s steps(2) infinite}
.center{text-align:center}
/* map */
.maphead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding-right:100px}
.maphead .me{display:flex;align-items:center;gap:8px;font-size:20px}
.maphead .me img{width:34px}
.stars{margin-left:auto;font-size:20px}
.map{position:relative;width:100%;aspect-ratio:4/3;max-height:74vh;margin:0 auto;border:4px solid var(--ink);border-radius:12px;background-color:#b9ee9f;background-image:conic-gradient(#aae790 25%,transparent 0 50%,#aae790 0 75%,transparent 0);background-size:40px 40px;box-shadow:0 6px 0 var(--ink);overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:15%;transform:translate(-50%,-50%);background:none;border:0;padding:0;text-align:center;z-index:3}
.node .frame{width:100%;aspect-ratio:1;border:4px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 5px 0 var(--ink);position:relative}
.node .frame img{width:100%;height:100%;object-fit:contain}
.node .num{position:absolute;left:-6px;top:-8px;background:var(--pink);border:3px solid var(--ink);border-radius:50%;width:28px;height:28px;font-size:16px;line-height:22px;z-index:2}
.node .nl{display:block;background:var(--cream);border:3px solid var(--ink);border-radius:8px;font-size:clamp(10px,1.7vw,15px);padding:1px 4px;margin-top:6px;white-space:nowrap}
.node .ns{display:block;font-size:clamp(12px,2vw,18px);color:#ffb300;text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);letter-spacing:1px}
.node.locked .frame img{filter:grayscale(1) brightness(.75)}
.node.locked .frame::after{content:'🔒';position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(20px,4vw,34px);background:#0004}
.node.open .frame{animation:bob .8s steps(2) infinite}
.node:not(.locked):hover .frame{border-color:#e8505b}
.mapkid{position:absolute;width:6%;transform:translate(-50%,-100%);z-index:5;transition:left .9s steps(9),top .9s steps(9);pointer-events:none;animation:bob .5s steps(2) infinite}
.deco{position:absolute;width:2.2%;z-index:1;pointer-events:none}
.tools{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
/* modal */
.modal{position:fixed;inset:0;background:#2b1b1088;display:none;place-items:center;z-index:60;padding:14px;overflow:auto}
.modal.on{display:grid}
.modal .panel{max-width:520px;width:100%;text-align:center;animation:pop .25s steps(4)}
@keyframes pop{from{transform:scale(.6)}}
.modal h2{margin:8px 0;font-size:28px}
.bigphoto{width:150px;border:4px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);background:#fff}
.diff{font-size:22px;color:#ff8c00}
.tag{display:inline-block;background:var(--sky);border:3px solid var(--ink);border-radius:8px;padding:2px 10px;margin:4px;font-size:16px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.bigstars{font-size:54px;color:#ffb300;text-shadow:3px 3px 0 var(--ink);letter-spacing:4px}
/* play */
.playbar{display:flex;align-items:center;gap:10px;padding-right:100px;flex-wrap:wrap}
.ptitle{font-size:clamp(18px,3vw,26px);color:#fff;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.dots{display:flex;gap:6px;margin:10px 0}
.dots i{width:22px;height:22px;border:3px solid var(--ink);background:#fff;border-radius:5px}
.dots i.done{background:var(--mint)}.dots i.now{background:var(--yellow);animation:bob .6s steps(2) infinite}
.coach{display:flex;align-items:flex-end;gap:10px;margin:6px 0 10px}
.coach img{width:76px;flex:none}
.bubble{position:relative;background:#fff;border:4px solid var(--ink);border-radius:12px;padding:10px 14px;font-size:clamp(15px,2.4vw,20px);min-height:48px;flex:1;display:flex;align-items:center}
.bubble::before{content:'';position:absolute;left:-14px;bottom:14px;border:8px solid transparent;border-right:10px solid var(--ink)}
.qbox{min-height:300px}
.qtitle{font-size:clamp(18px,3vw,25px);text-align:center;margin:0 0 12px;line-height:1.35}
.foot{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.pulse{animation:pulse .6s steps(2) infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.conf{position:fixed;width:10px;height:10px;z-index:99;pointer-events:none;box-shadow:0 0 0 2px var(--ink)}
/* snack tiles */
.seq{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.cell{width:clamp(44px,10vw,70px);aspect-ratio:1;background:#fff;border:4px solid var(--ink);border-radius:10px;display:grid;place-items:center;font-size:30px;position:relative}
.cell img{width:78%}
.cell.q{background:var(--yellow);animation:pulse .8s steps(2) infinite}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.opt{width:clamp(64px,16vw,96px);aspect-ratio:1;background:#fff;border:4px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;padding:0;font-size:30px}
.opt img{width:70%}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt.wrong{background:#ffc9c9;opacity:.6;pointer-events:none}
.opt.numopt{font-size:clamp(26px,6vw,40px)}
.status{text-align:center;font-size:clamp(17px,3vw,24px);margin:6px 0}
.pads{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.pad{width:clamp(70px,17vw,110px);aspect-ratio:1;background:#fff;border:4px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;padding:0}
.pad img{width:66%}
.pad.lit{background:var(--yellow);transform:translateY(5px) scale(1.08);box-shadow:0 1px 0 var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px;margin:10px auto;background:#e9c58d;border:4px solid var(--ink);border-radius:10px;padding:10px}
.shelf .it{aspect-ratio:1;background:#fff8e6;border:4px solid var(--ink);border-radius:10px;display:grid;place-items:center;padding:0;position:relative}
.shelf .it img{width:70%}
.shelf .it.sel{background:var(--mint);transform:translateY(-3px);box-shadow:0 5px 0 var(--ink)}
.shelf .it.sel::after{content:'✔';position:absolute;right:2px;top:-4px;font-size:20px}
.shelf .it.bad{background:#ffb3b3}
.ruleline{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
/* maze */
.mz{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.board{position:relative;display:grid;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);background:#ffe9b8}
.board .t{width:var(--c);height:var(--c);display:grid;place-items:center}
.board .t.a{background:#ffe9b8}.board .t.b{background:#ffdd9c}
.board .t img{width:90%}
.board .t img.home{width:100%;height:100%;object-fit:cover;border:2px solid var(--ink)}
.mk{position:absolute;width:calc(var(--c)*.78);margin:calc(var(--c)*.06) calc(var(--c)*.11);transition:left .3s steps(4),top .3s steps(4);z-index:3}
.mk.bump{animation:shake .3s}
.side{min-width:210px;max-width:300px;flex:1}
.prog{min-height:96px;background:#fff;border:4px solid var(--ink);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.prog b{width:34px;height:34px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:6px;background:var(--sky);font-size:18px}
.prog b.on{background:var(--yellow);transform:scale(1.2)}
.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.dirs button{aspect-ratio:1;font-size:26px;padding:0}
.limit{text-align:center;margin:0 0 6px;font-size:18px}
/* balance */
.eqs{display:flex;flex-direction:column;gap:8px;align-items:center;margin:8px 0}
.eq{display:flex;align-items:center;gap:4px;background:#fff;border:4px solid var(--ink);border-radius:10px;padding:4px 12px;min-width:min(100%,340px);justify-content:center;font-size:30px}
.eq img{width:clamp(30px,8vw,44px)}
.eq .n{background:var(--yellow);border:3px solid var(--ink);border-radius:8px;padding:0 12px;min-width:48px;text-align:center}
.eq.ask{background:#fff0a8}
/* logic */
.clues{background:#fff;border:4px dashed var(--brown);border-radius:10px;padding:8px 12px 8px 8px;font-size:clamp(15px,2.5vw,19px)}
.clues ol{margin:4px 0 0;padding-left:26px}.clues li{margin:3px 0}
.street{display:flex;gap:8px;justify-content:center;margin:14px 0 6px}
.slot{width:clamp(54px,16vw,110px);background:#fff;border:4px solid var(--ink);border-radius:10px;box-shadow:0 5px 0 var(--ink);padding:0;position:relative;overflow:hidden}
.slot img.photo{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.slot .hn{position:absolute;left:3px;top:3px;background:var(--pink);border:3px solid var(--ink);border-radius:50%;width:26px;height:26px;line-height:20px;font-size:15px}
.slot .who{height:clamp(44px,10vw,64px);background:#d6f0ff;display:grid;place-items:center;border-top:4px solid var(--ink)}
.slot .who img{height:90%}
.slot.hl{outline:4px solid var(--red)}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chip{background:#fff;border:4px solid var(--ink);border-radius:10px;padding:4px 10px;display:flex;align-items:center;gap:6px;font-size:18px;box-shadow:0 4px 0 var(--ink)}
.chip img{height:38px}
.chip.used{opacity:.4}.chip.sel{background:var(--yellow);transform:translateY(-4px)}
.arrow{text-align:center;font-size:14px;opacity:.7}
.kidcard{cursor:pointer}
.kidcard input.nm{width:100%;font-family:inherit;font-size:1em;text-align:center;border:3px solid var(--ink);border-radius:8px;padding:2px;background:#fff8e6;color:var(--ink);user-select:text;-webkit-user-select:text}
.note{margin-top:12px;font-size:clamp(15px,2.6vw,19px);background:var(--cream);border:4px solid var(--ink);border-radius:10px;padding:6px 10px}
.help{text-align:left;font-size:17px;line-height:1.45}.help ol{padding-left:22px;margin:6px 0}.help li{margin:6px 0}
.help .hl{background:#fff0a8;border:3px solid var(--ink);border-radius:8px;padding:6px 10px;margin:8px 0}.help .how{font-size:15px;background:#fff;border:3px dashed var(--brown);border-radius:8px;padding:6px 10px}
.node .frame,.bigphoto,.slot img.photo,.strip div{background:#cfeeff}
.modebtn.sel{background:var(--yellow);transform:translateY(-2px)}
.prog b.rp{background:var(--pink);width:auto;padding:0 6px;cursor:pointer}.prog b.en{background:var(--pink)}
.shelf .it.zone{background:#fff0a8}
.limit small{opacity:.7;font-size:.7em}
@media(max-width:560px){.node .nl{font-size:9px}.kidpick{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="sndbar">
  <button class="pbtn white" id="bSfx" title="효과음">🔊</button>
  <button class="pbtn white off" id="bBgm" title="배경음악">🎵</button>
</div>

<!-- 타이틀 -->
<section class="screen on" id="sTitle">
  <div class="logo"><small>🍪 우리가 만든 과자마을 🍪</small>과자마을<br>두뇌 대모험</div>
  <div class="strip" id="strip"></div>
  <div class="panel">
    <div class="center" style="font-size:clamp(18px,3vw,24px)">함께할 친구를 골라요! <span style="font-size:.7em;opacity:.7">(이름 칸을 눌러 바꿀 수 있어요)</span></div>
    <div class="kidpick" id="kidPick"></div>
    <div class="center" style="margin-bottom:12px;font-size:20px">난이도 <button class="pbtn sm white modebtn" data-m="normal">🌱 보통</button> <button class="pbtn sm white modebtn" data-m="hard">🔥 도전</button></div>
    <div class="center"><button class="pbtn pink" id="bStart" style="font-size:26px;padding:10px 40px">▶ 모험 시작!</button> <button class="pbtn white" id="bHelpT">❓ 게임 방법</button></div>
  </div>
</section>

<!-- 지도 -->
<section class="screen" id="sMap">
  <div class="maphead">
    <div class="me"><img id="meImg" class="pix"><b id="meName"></b></div>
    <div class="stars" id="totStars"></div>
  </div>
  <div class="map" id="map"></div>
  <div class="center note">🔒 앞 단계를 클리어하면 다음 집의 자물쇠가 열려요! 통통 튀는 집을 눌러 보세요.</div>
  <div class="tools">
    <button class="pbtn sm pink" id="bMode"></button>
    <button class="pbtn sm sky" id="bHelp">❓ 게임 방법</button>
    <button class="pbtn sm white" id="bTitle">🏠 친구·이름 바꾸기</button>
    <button class="pbtn sm white" id="bUnlock">🔓 전체 열기(선생님용)</button>
    <button class="pbtn sm white" id="bReset">♻ 처음부터 다시 하기</button>
  </div>
</section>

<!-- 플레이 -->
<section class="screen" id="sPlay">
  <div class="playbar">
    <button class="pbtn sm sky" id="bBack">🗺 지도</button>
    <button class="pbtn sm white" id="bHome">🏠 처음으로</button>
    <button class="pbtn sm pink" id="bRestart">🔄 처음부터</button>
    <div class="ptitle" id="pTitle"></div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="coach"><img id="coachImg" class="pix"><div class="bubble" id="bubble"></div></div>
  <div class="panel qbox" id="qbox">
    <h2 class="qtitle" id="qTitle"></h2>
    <div id="qBody"></div>
  </div>
  <div class="foot">
    <button class="pbtn mint" id="bCheck" style="display:none">✔ 확인</button>
    <button class="pbtn white" id="bHint">💡 힌트</button>
  </div>
</section>

<div class="modal" id="modal"><div class="panel" id="modalBox"></div></div>

<script>
'use strict';
/* ================= 기본 도구 ================= */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

/* ================= 게임 1: 패턴 ================= */
function gPattern(el,r,api){
  const letters=[...new Set(r.unit)],pool=shuffle(SN_KEYS),map={};letters.forEach((L,i)=>map[L]=pool[i]);
  const seq=Array.from({length:r.len},(_,i)=>map[r.unit[i%r.unit.length]]);
  const nh=r.holes||1;let holes;
  if(r.hole==='mid'||nh>1){const cand=[];for(let i=r.unit.length;i<r.len;i++)cand.push(i);holes=shuffle(cand).slice(0,nh).sort((a,b)=>a-b)}else holes=[r.len-1];
  const used=letters.map(L=>map[L]),extra=pool.filter(k=>!used.includes(k)).slice(0,Math.max(0,5-used.length)),opts=shuffle([...used,...extra]);
  let cur=0;
  api.title(nh>1?`규칙을 찾아 빈칸(?) ${nh}곳을 왼쪽부터 차례로 채워요!`:'규칙을 찾아서 빈칸(?)에 들어갈 과자를 골라요!');
  api.setHint(`${r.unit.length}개가 한 묶음이 되어 계속 반복돼요. 맨 앞에서부터 묶어 보세요!`+(nh>1?' 빈칸은 왼쪽부터 하나씩 채워요.':''));
  el.innerHTML=`<div class="seq">${seq.map((k,i)=>`<div class="cell ${holes.includes(i)?'q':''}" data-i="${i}">${holes.includes(i)?'?':`<img src="${SNIMG[k]}">`}</div>`).join('')}</div><div class="opts">${opts.map(k=>`<button class="opt" data-k="${k}"><img src="${SNIMG[k]}"></button>`).join('')}</div>`;
  $$('.opt',el).forEach(b=>b.onclick=()=>{
    if(api.done)return;const k=b.dataset.k,hi=holes[cur];
    if(k===seq[hi]){const c=$(`.cell[data-i="${hi}"]`,el);c.classList.remove('q');c.innerHTML=`<img src="${SNIMG[k]}">`;SFX.coin();cur++;if(cur>=holes.length)api.ok()}
    else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),700);api.bad()}
  });
}

/* ================= 게임 2: 기억 ================= */
function gMemory(el,r,api){
  const keys=shuffle(SN_KEYS).slice(0,r.n),seq=Array.from({length:r.len},()=>rnd(r.n)),exp=r.rev?seq.slice().reverse():seq,sp=r.speed||380;
  api.title(r.rev?`과자가 반짝이는 순서를 기억했다가 거꾸로(마지막부터) 눌러요! (${r.len}개) ↩`:`과자가 소리를 내며 반짝여요. 순서를 기억했다가 똑같이 눌러요! (${r.len}개)`);
  api.setHint(r.rev?'마지막으로 반짝인 과자부터 눌러요! "👀 다시 보기"로 순서를 한 번 더 볼 수 있어요.':'"👀 다시 보기"를 눌러서 순서를 한 번 더 볼 수 있어요. 소리의 높낮이도 단서예요!');
  el.innerHTML=`<div class="status" id="ms">준비되면 ▶ 시작을 눌러요!</div><div class="pads">${keys.map((k,i)=>`<button class="pad" data-i="${i}"><img src="${SNIMG[k]}"></button>`).join('')}</div><div class="row"><button class="pbtn mint" id="mS">▶ 시작</button><button class="pbtn white" id="mR" disabled>👀 다시 보기</button></div>`;
  const pads=$$('.pad',el),st=t=>{$('#ms',el).textContent=t};let phase='idle',idx=0,showing=false;
  const flash=async(i,len=sp)=>{pads[i].classList.add('lit');tone(SN_NOTE[keys[i]],len/1000,'square',.09);await sleep(len);pads[i].classList.remove('lit')};
  async function demo(){
    if(showing)return;showing=true;phase='show';st('잘 보세요! 👀');await sleep(500);
    for(const i of seq){if(api.dead)return;await flash(i);await sleep(sp*.5)}
    showing=false;phase='play';idx=0;st(`이제 ${r.rev?'거꾸로 ':''}눌러요! 👆 (0/${r.len})`);$('#mR',el).disabled=false;
  }
  $('#mS',el).onclick=()=>{$('#mS',el).style.display='none';demo()};
  $('#mR',el).onclick=()=>{if(!showing&&!api.done)demo()};
  pads.forEach(p=>p.onclick=async()=>{
    if(phase!=='play'||api.done)return;const i=+p.dataset.i;flash(i,200);
    if(i===exp[idx]){idx++;st(`좋아요! 👆 (${idx}/${r.len})`);if(idx===exp.length){phase='done';api.ok()}}
    else{phase='idle';api.bad('앗, 순서가 달라요! 다시 보여줄게요.');st('다시 볼까요? 👀');setTimeout(()=>{if(!api.dead)demo()},1500)}
  });
}

/* ================= 게임 3: 조건 고르기 ================= */
function gCondition(el,r,api){
  const COLS=4,nSel={is:1,or:2,not:1,notor:2,notor3:3}[r.op],out=r.op.startsWith('not'),rowsN=Math.ceil(r.cells/COLS);
  const wh={top2:i=>Math.floor(i/COLS)<2,bottom2:i=>Math.floor(i/COLS)>=rowsN-2,left2:i=>i%COLS<2,right2:i=>i%COLS>=COLS-2}[r.where]||(()=>true);
  const zoneName={top2:'위쪽 두 줄',bottom2:'아래쪽 두 줄',left2:'왼쪽 두 칸',right2:'오른쪽 두 칸'}[r.where];

/* ================= 게임 6: 논리 추리 ================= */
function genLogic(n,noPos,hard){
  const people=shuffle(KIDS).slice(0,n).map(k=>k.id);
  const perms=[];(function p(a,r){if(!a.length){perms.push(r);return}a.forEach((x,i)=>p(a.filter((_,j)=>j!==i),[...r,x]))})([...Array(n).keys()],[]);
  const nm=i=>kidById(people[i]).name;
  const test={pos:(c,s)=>s[c.a]===c.k,not:(c,s)=>s[c.a]!==c.k,end:(c,s)=>s[c.a]===0||s[c.a]===n-1,right:(c,s)=>s[c.a]>s[c.b],adjR:(c,s)=>s[c.a]===s[c.b]+1,next:(c,s)=>Math.abs(s[c.a]-s[c.b])===1,notnext:(c,s)=>Math.abs(s[c.a]-s[c.b])>1,between:(c,s)=>(s[c.b]<s[c.a]&&s[c.a]<s[c.c])||(s[c.c]<s[c.a]&&s[c.a]<s[c.b])};
  const text={pos:c=>`${J.eun(nm(c.a))} ${c.k+1}번째 집에 살아요.`,not:c=>`${J.eun(nm(c.a))} ${c.k+1}번째 집이 아니에요.`,end:c=>`${J.eun(nm(c.a))} 맨 왼쪽이나 맨 오른쪽 끝 집에 살아요.`,right:c=>`${J.eun(nm(c.a))} ${nm(c.b)}보다 오른쪽에 살아요.`,adjR:c=>`${J.eun(nm(c.a))} ${nm(c.b)}의 바로 오른쪽 집에 살아요.`,next:c=>`${J.wa(nm(c.a))} ${J.eun(nm(c.b))} 바로 옆집(이웃)이에요.`,notnext:c=>`${J.wa(nm(c.a))} ${J.eun(nm(c.b))} 바로 옆집이 아니에요.`,between:c=>`${J.eun(nm(c.a))} ${J.wa(nm(c.b))} ${nm(c.c)} 사이(두 친구 사이 어딘가)에 살아요.`};
  const cnt=cl=>{let k=0;for(const s of perms)if(cl.every(c=>test[c.t](c,s)))k++;return k};
  for(let tries=0;tries<400;tries++){
    const sol=shuffle([...Array(n).keys()]),C=[];
    for(let a=0;a<n;a++){
      if(!noPos)C.push({t:'pos',a,k:sol[a]});
      for(let k=0;k<n;k++)if(k!==sol[a])C.push({t:'not',a,k});
      if(sol[a]===0||sol[a]===n-1)C.push({t:'end',a});
      for(let b=0;b<n;b++)if(a!==b){if(sol[a]>sol[b])C.push({t:'right',a,b});if(sol[a]===sol[b]+1)C.push({t:'adjR',a,b});
        if(a<b&&Math.abs(sol[a]-sol[b])===1)C.push({t:'next',a,b});if(a<b&&Math.abs(sol[a]-sol[b])>1)C.push({t:'notnext',a,b});
        for(let c=b+1;c<n;c++)if(c!==a&&((sol[b]<sol[a]&&sol[a]<sol[c])||(sol[c]<sol[a]&&sol[a]<sol[b])))C.push({t:'between',a,b,c})}
    }
    const W={pos:3,adjR:3,next:3,right:3,between:3,end:2,notnext:1.5,not:hard?0.5:1};
    const pool=shuffle(C).sort((x,y)=>(W[y.t]*Math.random())-(W[x.t]*Math.random()));
    let cl=[],cur=perms.length;
    for(const c of pool){if(c.t==='between'&&cl.some(x=>x.t==='between'))continue;const nc=cnt([...cl,c]);if(nc<cur){cl.push(c);cur=nc}if(cur===1)break}
    if(cur!==1)continue;
    for(let i=cl.length-1;i>=0;i--){const t=cl.filter((_,j)=>j!==i);if(cnt(t)===1)cl=t}
    if(cl.length<2)continue;
    const used=new Set();cl.forEach(c=>{used.add(c.a);if(c.b!=null)used.add(c.b);if(c.c!=null)used.add(c.c)});
    if(used.size<n)continue;

  }

}
function gLogic(el,r,api){

    if(api.done)return;if(asg.some(x=>x==null)){api.say('모든 친구를 집에 앉혀 주세요!','sad');SFX.bad();return}
    if(asg.every((p,i)=>P.sol[p]===i))api.ok();
    else{const k=rnd(n);api.setHint(`${J.eun(kidById(P.people[k]).name)} ${P.sol[k]+1}번째 집에 살아요!`);api.bad('단서와 안 맞는 곳이 있어요. 다시 읽어 봐요!')}
  });
}

const GAMES={pattern:gPattern,memory:gMemory,condition:gCondition,maze:gMaze,balance:gBalance,logic:gLogic};
renderMap();
